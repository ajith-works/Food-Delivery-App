{% extends "base.html" %}
{% block title %}Add Restaurant - FoodExpress{% endblock %}
{% block content %}

<h2 class="fw-bold mb-4">Add Restaurant</h2>

<div class="card">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Restaurant Name</label>
        <input type="text" class="form-control" name="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Cuisine</label>
        <input type="text" class="form-control" name="cuisine" placeholder="e.g. Indian, Italian" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" class="form-control" name="address" required>
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Rating</label>
          <input type="number" step="0.1" min="0" max="5" class="form-control" name="rating" value="4.0">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Delivery Time (mins)</label>
          <input type="number" class="form-control" name="delivery_time_min" value="30">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Image URL</label>
          <input type="text" class="form-control" name="image_url" placeholder="https://...">
        </div>
      </div>
      <button type="submit" class="btn btn-brand">Save Restaurant</button>
    </form>
  </div>
</div>

{% endblock %}
