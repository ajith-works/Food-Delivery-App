{% extends "base.html" %}
{% block title %}Login - FoodExpress{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body">
        <h4 class="fw-bold mb-3 text-center">Welcome Back</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <button type="submit" class="btn btn-brand w-100">Login</button>
        </form>
        <p class="text-center text-muted small mt-3 mb-0">
          Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
        </p>
        <hr>
        <p class="text-muted small mb-0">Demo accounts:</p>
        <p class="text-muted small mb-0">Customer: customer@example.com / password123</p>
        <p class="text-muted small mb-0">Admin: admin@fooddelivery.com / admin123</p>
      </div>
    </div>
  </div>
</div>

{% endblock %}
